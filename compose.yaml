services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: octree_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - octree_net

  # 2. Automated Schema Initializer
  postgres-init:
    image: postgres:16-alpine
    container_name: octree_db_init
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      sh -c "
        until pg_isready -h postgres -U ${POSTGRES_USER}; do
          echo 'Waiting for postgres...'
          sleep 1
        done;
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'CREATE SCHEMA IF NOT EXISTS auth; CREATE EXTENSION IF NOT EXISTS pgcrypto;'
      "
    depends_on:
      - postgres
    networks:
      - octree_net

  # 3. Local Supabase Auth Microservice
  supabase-auth:
    image: supabase/gotrue:v2.161.0
    container_name: octree_auth
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      GOTRUE_SITE_URL: "https://octree.${DOMAIN_NAME}"
      GOTRUE_URI_ALLOW_LIST: "https://octree.${DOMAIN_NAME}/*"
      GOTRUE_CORS_ALLOWED_ORIGINS: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: "${SUPABASE_JWT_SECRET}"
      GOTRUE_JWT_EXP: "3600"
      API_EXTERNAL_URL: "https://octree-auth.${DOMAIN_NAME}"

      # Self-Hosted SMTP Configuration
      GOTRUE_SMTP_HOST: "${SMTP_HOST}"
      GOTRUE_SMTP_PORT: "${SMTP_PORT}"
      GOTRUE_SMTP_USER: "${SMTP_USER}"
      GOTRUE_SMTP_PASS: "${SMTP_PASS}"
      GOTRUE_SMTP_ADMIN_EMAIL: "${SMTP_ADMIN_EMAIL}"
      GOTRUE_MAILER_AUTCONFIRM: "false"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - octree_net

  # 4. LaTeX Compile Engine
  latex-compiler:
    image: matthewjarvis/latex-compileservice:latest
    container_name: octree_compiler
    restart: unless-stopped
    ports:
      - "8080:5000"
    networks:
      - octree_net

  # 5. AI Agent Backend
  octree-agent:
    build:
      context: ./agent_server
      dockerfile: Dockerfile
    container_name: octree_agent
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      COMPILE_SERVICE_URL: "http://latex-compiler:8080/compile"
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET}"
    depends_on:
      - latex-compiler
    networks:
      - octree_net

  # 6. Web Frontend
  octree-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOMAIN_NAME: "${DOMAIN_NAME}"
    container_name: octree_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      NEXT_PUBLIC_AGENT_SERVER_URL: "https://octree-agent.${DOMAIN_NAME}"
      COMPILE_SERVICE_URL: "http://latex-compiler:8080/compile"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET}"
      NEXT_PUBLIC_SUPABASE_URL: "https://octree-auth.${DOMAIN_NAME}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
    depends_on:
      - postgres
      - supabase-auth
      - octree-agent
    networks:
      - octree_net

volumes:
  postgres_data:

networks:
  octree_net:
    driver: bridge