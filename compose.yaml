services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: octree_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - octree_net

  # 2. Local Supabase Auth Microservice
  supabase-auth:
    image: supabase/gotrue:v2.161.0
    container_name: octree_auth
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      GOTRUE_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      GOTRUE_SITE_URL: "http://${LXC_HOST_IP}:3000"
      GOTRUE_URI_ALLOW_LIST: "http://${LXC_HOST_IP}:3000/*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: "${SUPABASE_JWT_SECRET}"
      GOTRUE_JWT_EXP: 3600
      API_EXTERNAL_URL: "http://${LXC_HOST_IP}:9999"
    depends_on:
      - postgres
    networks:
      - octree_net

  # 3. LaTeX Compile Engine
  latex-compiler:
    image: matthewjarvis/latex-compileservice:latest
    container_name: octree_compiler
    restart: unless-stopped
    ports:
      - "8080:5000"
    networks:
      - octree_net

  # 4. AI Agent Backend
  octree-agent:
    build:
      context: ./agent_server
      dockerfile: Dockerfile
    container_name: octree_agent
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      COMPILE_SERVICE_URL: "http://latex-compiler:8080/compile"
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET}"
    depends_on:
      - latex-compiler
    networks:
      - octree_net

  # 5. Web Frontend
  octree-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octree_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      NEXT_PUBLIC_AGENT_SERVER_URL: "http://${LXC_HOST_IP}:8787"
      COMPILE_SERVICE_URL: "http://latex-compiler:8080/compile"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET}"
      NEXT_PUBLIC_SUPABASE_URL: "http://${LXC_HOST_IP}:9999"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
    depends_on:
      - postgres
      - supabase-auth
      - octree-agent
    networks:
      - octree_net

volumes:
  postgres_data:

networks:
  octree_net:
    driver: bridge